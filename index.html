function snapshot(){return items.map(i=>({type:i.type,x:i.group.position.x,z:i.group.position.z,y:i.group.position.y,rotation:i.group.rotation.y,scale:i.group.scale.x,fabric:i.fabric,wood:i.wood,foods:i.foods||[],isOpen:!!i.isOpen}))}
function saveHistory(){history.push(snapshot());if(history.length>30)history.shift()}
function restore(data){items.forEach(i=>scene.remove(i.group));items=[];data.forEach(d=>{const g=makeFurniture(d.type,d.fabric,d.wood);g.position.set(d.x,d.y||0,d.z);g.rotation.y=d.rotation;g.scale.setScalar(d.scale);scene.add(g);const it={type:d.type,group:g,fabric:d.fabric||'Cream',wood:d.wood||'Oak',foods:[],isOpen:!!d.isOpen};(d.foods||[]).forEach(t=>{const food=makeFood(t),n=it.foods.length;food.position.set(-.42+(n%4)*.27,[.62,1.2,1.75][n%3],-.12+Math.floor(n/4)*.13);g.add(food);it.foods.push(t)});if(it.isOpen&&g.userData.door)g.userData.door.rotation.y=-1.22;items.push(it)});selected=null;updateSelection();renderTab()}

function addItem(type){if(catalog.find(p=>p.id===type)?.category==='Groceries')return addFoodToFridge(type);saveHistory();const g=makeFurniture(type);g.position.set((Math.random()-.5)*3,0,(Math.random()-.5)*3);scene.add(g);const item={type,group:g,fabric:'Cream',wood:'Oak',foods:[],isOpen:false};items.push(item);selectItem(item);notify('Added to your room')}

function rotateSelected(){if(!selected)return;saveHistory();selected.group.rotation.y+=Math.PI/4;notify('Furniture rotated')}
function duplicateSelected(){if(!selected)return;saveHistory();const g=makeFurniture(selected.type,selected.fabric,selected.wood);g.position.copy(selected.group.position);g.position.x+=.6;g.position.z+=.4;g.rotation.copy(selected.group.rotation);g.scale.copy(selected.group.scale);scene.add(g);const i={type:selected.type,group:g,fabric:selected.fabric,wood:selected.wood,foods:[],isOpen:false};if(selected.foods?.length){selected.foods.forEach(t=>{const food=makeFood(t),n=i.foods.length;food.position.set(-.42+(n%4)*.27,[.62,1.2,1.75][n%3],-.12+Math.floor(n/4)*.13);g.add(food);i.foods.push(t)})}items.push(i);selectItem(i);notify('Furniture duplicated')}

function renderProducts(){const s=(document.getElementById('search')?.value||'').toLowerCase(),f=catalog.filter(p=>(activeCategory==='All'||p.category===activeCategory)&&p.name.toLowerCase().includes(s));document.getElementById('products').innerHTML=f.map(p=>'<div class="product"><div class="product-art"><span class="emoji">'+p.emoji+'</span></div><div class="product-info"><strong>'+p.name+'</strong><small>'+p.category+' · $'+p.price+'</small><button class="add" onclick="addItem(\''+p.id+'\')">＋ ADD TO ROOM</button></div></div>').join('')||'<div class="empty">No pieces found. Try another search.</div>'}
function chooseCategory(c){activeCategory=c;renderTab()}
function renderEdit(p){p.innerHTML='<div class="section-title">Furniture adjustments</div>'+(selected?'<div class="control-group"><div class="control-label">Selected piece <span>'+selected.type+'</span></div><div class="button-grid"><button class="control-button" onclick="rotateSelected()">↻ Rotate 45°</button><button class="control-button" onclick="duplicateSelected()">＋ Duplicate</button><button class="control-button" onclick="deleteSelected()">Remove piece</button><button class="control-button" onclick="undo()">↶ Undo</button></div></div>'+(selected.type==='fridge'?'<div class="control-group"><div class="control-label">Refrigerator <span>'+(selected.foods?.length||0)+' groceries inside</span></div><button class="control-button" onclick="toggleFridgeDoor()">'+(selected.isOpen?'Close refrigerator':'Open refrigerator')+'</button><div class="section-title" style="margin-top:14px">Restock with food</div><div class="button-grid">'+catalog.filter(x=>x.category==='Groceries').map(x=>'<button class="control-button" onclick="addFoodToFridge(\''+x.id+'\')">'+x.emoji+' '+x.name+'</button>').join('')+'</div></div>':'')+'<div class="control-group"><div class="control-label">Size <span>Adjust scale</span></div><input type="range" min=".5" max="1.7" step=".05" value="'+selected.group.scale.x+'" oninput="resizeSelected(this.value)"></div><div class="control-group"><div class="control-label">Fabric / upholstery</div><select onchange="replaceSelected(\'fabric\',this.value)">'+Object.keys(fabrics).map(f=>'<option '+(selected.fabric===f?'selected':'')+'>'+f+'</option>').join('')+'</select></div><div class="control-group"><div class="control-label">Wood finish</div><select onchange="replaceSelected(\'wood\',this.value)">'+Object.keys(woods).map(w=>'<option '+(selected.wood===w?'selected':'')+'>'+w+'</option>').join('')+'</select></div>':'<div class="empty">Select a piece of furniture in the room to edit it. Drag it to a new position, then adjust its size, color, and finish here.</div>')+'<div class="control-group"><div class="section-title">Room objects <small>'+items.length+' placed</small></div>'+items.map((it,i)=>'<button class="control-button" style="margin:3px" onclick="selectItem(items['+i+'])">'+(catalog.find(p=>p.id===it.type)?.name||it.type)+'</button>').join('')+'</div>'}
function renderRoom(p){p.innerHTML='<div class="section-title">Room atmosphere</div><div class="control-group"><div class="control-label">Wall color</div><div class="color-row">'+['#e8e1d5','#f0eee8','#d9d5ca','#b8bcae','#c4d0d0','#d7c2b6','#b9a99a','#aaa6b3'].map(c=>'<button class="swatch" style="background:'+c+'" onclick="setWall(\''+c+'\')"></button>').join('')+'</div></div><div class="control-group"><div class="control-label">Floor finish</div><div class="color-row">'+['#b18b66','#8b6445','#d0b99a','#70513c','#b8b4a8','#68655d'].map(c=>'<button class="swatch" style="background:'+c+'" onclick="setFloor(\''+c+'\')"></button>').join('')+'</div></div><div class="control-group"><div class="control-label">Lighting <span id="brightnessLabel">'+roomSettings.brightness.toFixed(1)+'x</span></div><input type="range" min=".4" max="1.8" step=".1" value="'+roomSettings.brightness+'" oninput="setBrightness(this.value)"></div><div class="control-group"><div class="section-title">Design tools</div><div class="button-grid"><button class="control-button" onclick="undo()">↶ Undo</button><button class="control-button" onclick="resetRoom()">Reset room</button><button class="control-button" onclick="saveDesign()">Save design</button><button class="control-button" onclick="loadDesign()">Load design</button></div></div>'}
function setWall(c){saveHistory();wallMat.color.set(c);sideWallMat.color.set(c);roomSettings.wall=c;notify('Wall color changed')}
function setFloor(c){saveHistory();floorMat.color.set(c);roomSettings.floor=c;notify('Floor finish changed')}
function setBrightness(v){roomSettings.brightness=+v;sun.intensity=3.2*+v;fill.intensity=.75*+v;warmLight.intensity=30*+v;const l=document.getElementById('brightnessLabel');if(l)l.textContent=(+v).toFixed(1)+'x'}
function setCamera(v){if(v==='front'){camera.position.set(0,4,12);controls.target.set(0,1.5,0)}if(v==='corner'){camera.position.set(8,6,9);controls.target.set(0,1.5,0)}if(v==='top'){camera.position.set(0,13,.01);controls.target.set(0,0,0)}controls.update()}
function saveDesign(){localStorage.setItem('roomRevivalProject',JSON.stringify({items:snapshot(),roomSettings}));notify('Your design has been saved')}
function loadDesign(){const raw=localStorage.getItem('roomRevivalProject');if(!raw)return notify('No saved design found');const d=JSON.parse(raw);roomSettings=d.roomSettings||roomSettings;wallMat.color.set(roomSettings.wall);sideWallMat.color.set(roomSettings.wall);floorMat.color.set(roomSettings.floor);setBrightness(roomSettings.brightness);restore(d.items||[]);notify('Saved design loaded')}
function resetRoom(){if(!confirm('Start over with an empty room?'))return;saveHistory();items.forEach(i=>scene.remove(i.group));items=[];selected=null;updateSelection();notify('Room cleared')}
function notify(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>e.classList.remove('show'),1800)}
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hit=new THREE.Vector3();let pointerDown=null;
function getPointer(e){const r=canvas.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*2-1;pointer.y=-(e.clientY-r.top)/r.height*2+1;raycaster.setFromCamera(pointer,camera)}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;getPointer(e);const hits=raycaster.intersectObjects(items.map(i=>i.group),true);if(hits.length){let o=hits[0].object;while(o.parent&&!items.some(i=>i.group===o))o=o.parent;const it=items.find(i=>i.group===o);if(it){selectItem(it);pointerDown={x:e.clientX,y:e.clientY,item:it,moved:false};controls.enabled=false}}else{selected=null;updateSelection()}});
canvas.addEventListener('pointermove',e=>{if(!pointerDown)return;if(Math.hypot(e.clientX-pointerDown.x,e.clientY-pointerDown.y)>4){if(!pointerDown.moved){saveHistory();pointerDown.moved=true}getPointer(e);if(raycaster.ray.intersectPlane(plane,hit)){pointerDown.item.group.position.x=THREE.MathUtils.clamp(hit.x,-4.3,4.3);pointerDown.item.group.position.z=THREE.MathUtils.clamp(hit.z,-4.3,4.3)}}});
function endDrag(){pointerDown=null;controls.enabled=true}canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointerleave',endDrag);canvas.addEventListener('contextmenu',e=>e.preventDefault());
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}new ResizeObserver(resize).observe(canvas);resize();
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
[['sofa',0,-1.8],['coffee',0,.15],['rug',0,.35],['plant',-3.8,-3.8],['lamp',3.7,-2.8],['armchair',2.5,1.3]].forEach(([type,x,z])=>{const g=makeFurniture(type);g.position.set(x,0,z);scene.add(g);items.push({type,group:g,fabric:'Cream',wood:'Oak'})});renderTab();
Object.assign(window,{addItem,addFoodToFridge,toggleFridgeDoor,showTab,chooseCategory,renderProducts,rotateSelected,duplicateSelected,deleteSelected,resizeSelected,undo,resetRoom,saveDesign,loadDesign,setCamera,setWall,setFloor,setBrightness,replaceSelected,selectItem});
</script></body></html>
